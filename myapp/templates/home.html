<!DOCTYPE html>
<html>
<head>
    <title>Home</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: white;
            text-align: center;
            padding-top: 100px;
        }

        .container {
            background: #e5e5e9;
            padding: 40px;
            border-radius: 30px;
            width: 350px;
            margin: auto;
        }

        a {
            display: inline-block;
            padding: 12px 30px;
            background: #d0d0d4;
            border-radius: 15px;
            color: black;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Welcome!</h1>
    <p>You are successfully logged in.</p>

    <h3>{{ request.user.first_name }}</h3>

    <a href="{% url 'logout' %}">Logout</a>

</div>

</body>
</html>
