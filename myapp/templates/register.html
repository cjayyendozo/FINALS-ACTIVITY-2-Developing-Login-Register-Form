<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: #e5e5e9;
            padding: 40px;
            width: 380px;
            border-radius: 30px;
        }

        h1, p {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 14px;
            margin: 10px 0 20px;
            border: none;
            border-radius: 15px;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 12px 40px;
            border: none;
            border-radius: 15px;
            background: #d0d0d4;
            cursor: pointer;
        }

        a {
            color: black;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>REGISTER</h1>
    <p>Create Your Account</p>

    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}

        <label>Full Name:</label>
        <input type="text" name="name" required>

        <label>Email Address:</label>
        <input type="email" name="email" required>

        <label>Password:</label>
        <input type="password" name="password" required>

        <label>Confirm Password:</label>
        <input type="password" name="confirm_password" required>

        <button type="submit">Register</button>
    </form>

    <p>
        Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </p>

</div>

</body>
</html>
